[package]
name = "votion"
version = "0.0.1"
description = "AI知识库驱动的本地笔记软件"
authors = ["viperasi"]
license = "MIT"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }
base64 = "0.21"
image = { version = "0.24", default-features = false, features = ["png"] }
usvg = { version = "0.29" }
resvg = { version = "0.29" }
tiny-skia = { version = "0.8.4", features = ["png"] }

[dependencies]
tauri = { version = "1.5", features = [ "window-unmaximize", "window-maximize", "window-minimize", "window-close", "window-start-dragging", "dialog-save", "dialog-open", "shell-open", "clipboard-write-text"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
notify = "6"
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1.0"
walkdir = "2.5"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.11", features = ["json", "blocking", "rustls-tls"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
